<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyperbeam Fullscreen</title>
<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; background:black; }
#browsers { width:100vw; height:100vh; }
</style>
</head>
<body>
<div id="browsers"></div>

<script type="module">
import { Hyperbeam } from "https://cdn.hyperbeam.com/hyperbeam.min.js";

const container = document.getElementById("browsers");

async function startVM() {
  try {
    // Fetch the session from your API
    const res = await fetch("/api/create-session");
    const data = await res.json();

    console.log("API response:", data);

    if (!data.embed_url) {
      container.innerText = "No embed_url returned from API";
      return;
    }

    // Hyperbeam now requires the embed object
    const embedOptions = {
      container,
      sessionId: data.session_id,
      token: data.admin_token || undefined, // admin token if present
      startFullscreen: true, // fullscreen the VM
    };

    // Initialize Hyperbeam
    await Hyperbeam(embedOptions);
    console.log("VM started successfully!");

  } catch (err) {
    console.error("Failed to start VM:", err);
    container.innerText = "Failed to load VM";
  }
}

startVM();
</script>
</body>
</html>
